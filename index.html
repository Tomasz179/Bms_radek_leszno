<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>JK-BMS Monitor</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
    h1 { color: #333; }
    .bms { background: #fff; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
    .bms h2 { margin-top: 0; }
    .sensor { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Monitor 3x JK-BMS</h1>

  <div class="bms" id="bms1">
    <h2>BMS 1</h2>
    <div class="sensor">Voltage: <span id="bms1_voltage">---</span></div>
    <div class="sensor">Current: <span id="bms1_current">---</span></div>
    <div class="sensor">Power: <span id="bms1_power">---</span></div>
    <div class="sensor">SOC: <span id="bms1_soc">---</span></div>
    <div class="sensor">Capacity: <span id="bms1_capacity">---</span></div>
    <div class="sensor">Balancer: <span id="bms1_balancer">---</span></div>
  </div>

  <div class="bms" id="bms2">
    <h2>BMS 2</h2>
    <div class="sensor">Voltage: <span id="bms2_voltage">---</span></div>
    <div class="sensor">Current: <span id="bms2_current">---</span></div>
    <div class="sensor">Power: <span id="bms2_power">---</span></div>
    <div class="sensor">SOC: <span id="bms2_soc">---</span></div>
    <div class="sensor">Capacity: <span id="bms2_capacity">---</span></div>
    <div class="sensor">Balancer: <span id="bms2_balancer">---</span></div>
  </div>

  <div class="bms" id="bms3">
    <h2>BMS 3</h2>
    <div class="sensor">Voltage: <span id="bms3_voltage">---</span></div>
    <div class="sensor">Current: <span id="bms3_current">---</span></div>
    <div class="sensor">Power: <span id="bms3_power">---</span></div>
    <div class="sensor">SOC: <span id="bms3_soc">---</span></div>
    <div class="sensor">Capacity: <span id="bms3_capacity">---</span></div>
    <div class="sensor">Balancer: <span id="bms3_balancer">---</span></div>
  </div>

  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    // połącz z brokerem MQTT
    const client = mqtt.connect('wss://broker.hivemq.com:8000/mqtt');

    client.on('connect', function () {
      console.log('Połączono z brokerem MQTT');

      // subskrybuj wszystkie tematy sensorów
      const sensors = ['voltage','current','power','soc','battery_capacity','balancer_current'];
      for(let i=1; i<=3; i++) {
        sensors.forEach(sensor => {
          client.subscribe(`bms_radek_leszno/sensor/jk-bms_${i}_${sensor}/state`);
        });
      }
    });

    client.on('message', function(topic, message) {
      const value = message.toString();
      // dopasuj topic do odpowiedniego elementu
      const regex = /jk-bms_(\d+)_(\w+)\/state/;
      const match = topic.match(regex);
      if(match){
        const bmsNum = match[1];
        let sensorName = match[2];
        // zamień _ na przyjazne nazwy w HTML
        if(sensorName === 'battery_capacity') sensorName = 'capacity';
        if(sensorName === 'balancer_current') sensorName = 'balancer';
        document.getElementById(`bms${bmsNum}_${sensorName}`).innerText = value;
      }
    });

    client.on('error', function(err) {
      console.error('MQTT Error:', err);
    });
  </script>
</body>
</html>
