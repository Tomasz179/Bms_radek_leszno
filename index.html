<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magazyny Energii – Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root{ --card-w:1200px; }

    body{
      font-family: 'Segoe UI', Arial, sans-serif;
      padding:20px;
      margin:0;
      background: #eef2f6;
      color:#111;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#333;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    #status{
      text-align:center;
      font-size:13px;
      margin-bottom:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
      gap:16px;
      max-width:var(--card-w);
      margin:0 auto;
    }

    .card{
      background: white;
      border-radius:16px;
      padding:16px 20px;
      box-shadow:0 4px 16px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover{
      transform: translateY(-4px);
      box-shadow:0 8px 24px rgba(0,0,0,0.12);
    }

    .label{
      font-weight:bold;
      font-size:14px;
      color:#555;
    }

    .value{
      display:flex;
      justify-content: space-between;
      align-items:center;
      font-weight:700;
      font-size:18px;
      margin-top:6px;
    }

    .unit{
      font-weight:500;
      color:#888;
      margin-left:4px;
    }

    .soc-bar{
      height: 8px;
      border-radius: 6px;
      background:#ddd;
      margin-top:6px;
      overflow:hidden;
    }

    .soc-fill{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, #4caf50, #81c784);
      transition: width 0.3s ease;
    }

    .balancer{
      color:#f44336;
      font-weight:700;
    }

    .bms-title{
      font-size:16px;
      margin-bottom:6px;
      color:#222;
    }

  </style>
</head>

<body>
<h1>Magazyny Energii – Dashboard</h1>
<div id="status">
  MQTT: <b id="mqttStatus">—</b>
  <span id="diag"></span>
</div>

<div class="grid">
  <!-- BMS 1 -->
  <div class="card">
    <div class="bms-title">BMS 1</div>
    <div class="label">Napięcie</div>
    <div class="value"><span id="bms1_voltage">—</span><span class="unit">V</span></div>

    <div class="label">Prąd</div>
    <div class="value"><span id="bms1_current">—</span><span class="unit">A</span></div>

    <div class="label">Moc</div>
    <div class="value"><span id="bms1_power">—</span><span class="unit">W</span></div>

    <div class="label">SOC</div>
    <div class="value"><span id="bms1_soc">—</span><span class="unit">%</span></div>
    <div class="soc-bar"><div id="bms1_soc_bar" class="soc-fill"></div></div>

    <div class="label">Pojemność</div>
    <div class="value"><span id="bms1_capacity">—</span><span class="unit">Ah</span></div>

    <div class="label">Balancer</div>
    <div class="value balancer"><span id="bms1_balancer">—</span><span class="unit">A</span></div>
  </div>

  <!-- BMS 2 -->
  <div class="card">
    <div class="bms-title">BMS 2</div>
    <div class="label">Napięcie</div>
    <div class="value"><span id="bms2_voltage">—</span><span class="unit">V</span></div>

    <div class="label">Prąd</div>
    <div class="value"><span id="bms2_current">—</span><span class="unit">A</span></div>

    <div class="label">Moc</div>
    <div class="value"><span id="bms2_power">—</span><span class="unit">W</span></div>

    <div class="label">SOC</div>
    <div class="value"><span id="bms2_soc">—</span><span class="unit">%</span></div>
    <div class="soc-bar"><div id="bms2_soc_bar" class="soc-fill"></div></div>

    <div class="label">Pojemność</div>
    <div class="value"><span id="bms2_capacity">—</span><span class="unit">Ah</span></div>

    <div class="label">Balancer</div>
    <div class="value balancer"><span id="bms2_balancer">—</span><span class="unit">A</span></div>
  </div>

  <!-- BMS 3 -->
  <div class="card">
    <div class="bms-title">BMS 3</div>
    <div class="label">Napięcie</div>
    <div class="value"><span id="bms3_voltage">—</span><span class="unit">V</span></div>

    <div class="label">Prąd</div>
    <div class="value"><span id="bms3_current">—</span><span class="unit">A</span></div>

    <div class="label">Moc</div>
    <div class="value"><span id="bms3_power">—</span><span class="unit">W</span></div>

    <div class="label">SOC</div>
    <div class="value"><span id="bms3_soc">—</span><span class="unit">%</span></div>
    <div class="soc-bar"><div id="bms3_soc_bar" class="soc-fill"></div></div>

    <div class="label">Pojemność</div>
    <div class="value"><span id="bms3_capacity">—</span><span class="unit">Ah</span></div>

    <div class="label">Balancer</div>
    <div class="value balancer"><span id="bms3_balancer">—</span><span class="unit">A</span></div>
  </div>

</div>

<script>
(() => {
  const PREFIX = "bms_radek_leszno";
  const WS_URL = "wss://broker.hivemq.com:8884/mqtt";

  const TOPICS = {
    bms1_voltage: `${PREFIX}/sensor/jk-bms_1_voltage/state`,
    bms1_current: `${PREFIX}/sensor/jk-bms_1_current/state`,
    bms1_power: `${PREFIX}/sensor/jk-bms_1_power/state`,
    bms1_soc: `${PREFIX}/sensor/jk-bms_1_soc/state`,
    bms1_capacity: `${PREFIX}/sensor/jk-bms_1_battery_capacity/state`,
    bms1_balancer: `${PREFIX}/sensor/jk-bms_1_balancer_current/state`,

    bms2_voltage: `${PREFIX}/sensor/jk-bms_2_voltage/state`,
    bms2_current: `${PREFIX}/sensor/jk-bms_2_current/state`,
    bms2_power: `${PREFIX}/sensor/jk-bms_2_power/state`,
    bms2_soc: `${PREFIX}/sensor/jk-bms_2_soc/state`,
    bms2_capacity: `${PREFIX}/sensor/jk-bms_2_battery_capacity/state`,
    bms2_balancer: `${PREFIX}/sensor/jk-bms_2_balancer_current/state`,

    bms3_voltage: `${PREFIX}/sensor/jk-bms_3_voltage/state`,
    bms3_current: `${PREFIX}/sensor/jk-bms_3_current/state`,
    bms3_power: `${PREFIX}/sensor/jk-bms_3_power/state`,
    bms3_soc: `${PREFIX}/sensor/jk-bms_3_soc/state`,
    bms3_capacity: `${PREFIX}/sensor/jk-bms_3_battery_capacity/state`,
    bms3_balancer: `${PREFIX}/sensor/jk-bms_3_balancer_current/state`,
  };

  const el = {};
  Object.keys(TOPICS).forEach(k => el[k] = document.getElementById(k));
  const socBars = {
    bms1: document.getElementById("bms1_soc_bar"),
    bms2: document.getElementById("bms2_soc_bar"),
    bms3: document.getElementById("bms3_soc_bar")
  };

  const client = mqtt.connect(WS_URL, {clientId:"web_"+Math.random().toString(16).slice(2)});

  let msg=0,last=0;
  const diag = () => document.getElementById('diag').innerHTML=
    ` | msg: <b>${msg}</b> | last: <b>${last?new Date(last).toLocaleTimeString():"—"}</b>`;

  client.on('connect',()=>{
    document.getElementById('mqttStatus').textContent="połączono";
    Object.values(TOPICS).forEach(t => client.subscribe(t));
  });

  client.on('message',(topic,payload)=>{
    msg++; last=Date.now(); diag();
    const v = parseFloat(payload.toString());
    for(const key in TOPICS){
      if(TOPICS[key] === topic){
        el[key].textContent = isNaN(v)?"—":v.toFixed(2);
        // aktualizacja SOC bar
        if(key.includes("soc")){
          const bms = key.split("_")[0];
          socBars[bms].style.width = isNaN(v)?'0%':v+'%';
        }
      }
    }
  });

  client.on('offline',()=>document.getElementById('mqttStatus').textContent="offline");
  client.on('error',()=>document.getElementById('mqttStatus').textContent="błąd");

})();
</script>

</body>
</html>
