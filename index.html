<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>MQTT Debug</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
<h1>MQTT Debug</h1>
<div id="log" style="white-space:pre-wrap;"></div>

<script>
const log = document.getElementById("log");
const BROKER = "wss://broker.hivemq.com:8884/mqtt"; // WSS dla HTTPS

const client = mqtt.connect(BROKER);

client.on("connect", ()=>{
    log.innerText += "Połączono z brokerem\n";
    client.subscribe("#"); // wszystko
});

client.on("message", (topic, message)=>{
    log.innerText += `Topic: ${topic} → ${message.toString()}\n`;
    log.scrollTop = log.scrollHeight;
});

client.on("error", (err)=>{
    log.innerText += `Błąd: ${err}\n`;
});
</script>
</body>
</html>
