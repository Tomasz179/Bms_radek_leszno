<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magazyny Energii – Dashboard</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
  :root{
    --card-w: 1200px;
    --primary: #4fc3f7;
    --secondary: #81d4fa;
    --danger: #ff5252;
    --soc-good: #4caf50;
    --soc-mid: #ffeb3b;
    --soc-low: #ff9800;
  }

  body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background: url('https://www.transparenttextures.com/patterns/asfalt-light.png') repeat;
    opacity:0.05;
    z-index:-1;
  }

  h1{
    text-align:center;
    margin:20px 0 10px;
    font-size:2em;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    letter-spacing:1px;
  }

  #status{
    text-align:center;
    font-size:14px;
    margin-bottom:30px;
    color:#ddd;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    max-width:var(--card-w);
    margin:0 auto;
    padding-bottom:40px;
  }

  .card{
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius:16px;
    padding:20px 24px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    transition: transform 0.25s, box-shadow 0.25s;
    position:relative;
    overflow:hidden;
  }

  .card:hover{
    transform: translateY(-5px);
    box-shadow:0 16px 40px rgba(0,0,0,0.6);
  }

  .bms-title{
    font-size:1.3em;
    font-weight:bold;
    margin-bottom:12px;
    color:#fff;
    text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }

  .label{
    display:block;
    font-weight:500;
    color:#ccc;
    font-size:0.95em;
  }

  .value{
    display:flex;
    justify-content: space-between;
    align-items:center;
    font-weight:700;
    font-size:1.4em;
    margin:4px 0 12px;
  }

  .unit{
    font-size:0.9em;
    font-weight:500;
    color:#eee;
    margin-left:6px;
  }

  .soc-bar{
    height:12px;
    border-radius:8px;
    background: rgba(255,255,255,0.15);
    margin-top:4px;
    overflow:hidden;
  }

  .soc-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, #4caf50, #81c784);
    transition: width 0.4s ease;
  }

  .balancer{
    color: var(--danger);
    font-weight:700;
    font-size:1.1em;
  }

  #mqttStatus{
    font-weight:bold;
    color:#4fc3f7;
  }
</style>
</head>

<body>
<h1>Magazyny Energii – Dashboard</h1>
<div id="status">
MQTT: <b id="mqttStatus">—</b> <span id="diag"></span>
</div>

<div class="grid">
  <!-- BMS 1 -->
  <div class="card" id="bms1Card">
    <div class="bms-title">Magazyn 1</div>
    <span class="label">Napięcie</span><div class="value"><span id="bms1_v">—</span><span class="unit">V</span></div>
    <span class="label">Prąd</span><div class="value"><span id="bms1_a">—</span><span class="unit">A</span></div>
    <span class="label">Moc</span><div class="value"><span id="bms1_w">—</span><span class="unit">W</span></div>
    <span class="label">SOC</span>
    <div class="soc-bar"><div class="soc-fill" id="bms1_soc"></div></div>
    <span class="label">Balancer</span><div class="value balancer"><span id="bms1_bal">—</span><span class="unit">A</span></div>
  </div>

  <!-- BMS 2 -->
  <div class="card" id="bms2Card">
    <div class="bms-title">Magazyn 2</div>
    <span class="label">Napięcie</span><div class="value"><span id="bms2_v">—</span><span class="unit">V</span></div>
    <span class="label">Prąd</span><div class="value"><span id="bms2_a">—</span><span class="unit">A</span></div>
    <span class="label">Moc</span><div class="value"><span id="bms2_w">—</span><span class="unit">W</span></div>
    <span class="label">SOC</span>
    <div class="soc-bar"><div class="soc-fill" id="bms2_soc"></div></div>
    <span class="label">Balancer</span><div class="value balancer"><span id="bms2_bal">—</span><span class="unit">A</span></div>
  </div>

  <!-- BMS 3 -->
  <div class="card" id="bms3Card">
    <div class="bms-title">Magazyn 3</div>
    <span class="label">Napięcie</span><div class="value"><span id="bms3_v">—</span><span class="unit">V</span></div>
    <span class="label">Prąd</span><div class="value"><span id="bms3_a">—</span><span class="unit">A</span></div>
    <span class="label">Moc</span><div class="value"><span id="bms3_w">—</span><span class="unit">W</span></div>
    <span class="label">SOC</span>
    <div class="soc-bar"><div class="soc-fill" id="bms3_soc"></div></div>
    <span class="label">Balancer</span><div class="value balancer"><span id="bms3_bal">—</span><span class="unit">A</span></div>
  </div>
</div>

<script>
(() => {
  const PREFIX = "bms_radek_leszno";
  const WS_URL = "wss://broker.hivemq.com:8884/mqtt";

  const TOPICS = {
    bms1_v: `${PREFIX}/sensor/jk-bms_1_voltage/state`,
    bms1_a: `${PREFIX}/sensor/jk-bms_1_current/state`,
    bms1_w: `${PREFIX}/sensor/jk-bms_1_power/state`,
    bms1_soc: `${PREFIX}/sensor/jk-bms_1_soc/state`,
    bms1_bal: `${PREFIX}/sensor/jk-bms_1_balancer_current/state`,

    bms2_v: `${PREFIX}/sensor/jk-bms_2_voltage/state`,
    bms2_a: `${PREFIX}/sensor/jk-bms_2_current/state`,
    bms2_w: `${PREFIX}/sensor/jk-bms_2_power/state`,
    bms2_soc: `${PREFIX}/sensor/jk-bms_2_soc/state`,
    bms2_bal: `${PREFIX}/sensor/jk-bms_2_balancer_current/state`,

    bms3_v: `${PREFIX}/sensor/jk-bms_3_voltage/state`,
    bms3_a: `${PREFIX}/sensor/jk-bms_3_current/state`,
    bms3_w: `${PREFIX}/sensor/jk-bms_3_power/state`,
    bms3_soc: `${PREFIX}/sensor/jk-bms_3_soc/state`,
    bms3_bal: `${PREFIX}/sensor/jk-bms_3_balancer_current/state`,
  };

  const el = {
    bms1_v: document.getElementById('bms1_v'),
    bms1_a: document.getElementById('bms1_a'),
    bms1_w: document.getElementById('bms1_w'),
    bms1_soc: document.getElementById('bms1_soc'),
    bms1_bal: document.getElementById('bms1_bal'),

    bms2_v: document.getElementById('bms2_v'),
    bms2_a: document.getElementById('bms2_a'),
    bms2_w: document.getElementById('bms2_w'),
    bms2_soc: document.getElementById('bms2_soc'),
    bms2_bal: document.getElementById('bms2_bal'),

    bms3_v: document.getElementById('bms3_v'),
    bms3_a: document.getElementById('bms3_a'),
    bms3_w: document.getElementById('bms3_w'),
    bms3_soc: document.getElementById('bms3_soc'),
    bms3_bal: document.getElementById('bms3_bal'),

    mqttStatus: document.getElementById('mqttStatus'),
    diag: document.getElementById('diag'),
  };

  function num(v){ const m=String(v).match(/-?\d+(?:[.,]\d+)?/); return m?parseFloat(m[0].replace(',','.')):NaN; }
  const fmt=n=>isNaN(n)?"—":n.toFixed(1).replace('.',',');

  const client = mqtt.connect(WS_URL, {clientId:"web_"+Math.random().toString(16).slice(2)});
  client.on('connect',()=>{ 
    el.mqttStatus.textContent="połączono"; 
    Object.values(TOPICS).forEach(t=>client.subscribe(t));
  });

  let msg=0, last=0;
  const diag=()=> el.diag.innerHTML=` | msg: <b>${msg}</b> | last: <b>${last?new Date(last).toLocaleTimeString():"—"}</b>`;

  client.on('message',(t,p)=>{
    msg++; last=Date.now(); diag();
    const v=num(p.toString());

    Object.keys(TOPICS).forEach(k=>{
      if(t===TOPICS[k]){
        if(k.includes('soc')){
          el[k].style.width = Math.min(100, Math.max(0,v)) + '%';
        } else {
          el[k].textContent = fmt(v);
        }
      }
    });
  });

  client.on('offline',()=>el.mqttStatus.textContent="offline");
  client.on('error',()=>el.mqttStatus.textContent="błąd");
})();
</script>

</body>
</html>
