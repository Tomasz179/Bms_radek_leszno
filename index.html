<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magazyny Energii – Dashboard</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root { --card-w: 1200px; }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      color: #111;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    }

    h1 {
      text-align: center;
      margin: 8px 0 20px;
      color: #fff;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }

    #status {
      max-width: var(--card-w);
      margin: 0.5rem auto 1rem;
      font-size: 14px;
      text-align: center;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 15px;
      max-width: var(--card-w);
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .label { font-weight: bold; }
    .value { float: right; font-weight: 700; min-width: 90px; text-align: right; display: inline-block; }
    .unit { margin-left: 4px; color: #666; font-weight: 500; }

    .cell-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .cell {
      background: rgba(200, 230, 250, 0.9);
      padding: 5px;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .bms-header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
      color: #333;
    }

    .bms-soc {
      margin-top: 6px;
      text-align: center;
      font-weight: 600;
      color: #111;
    }

  </style>
</head>

<body>
  <h1>Magazyny Energii – Dashboard</h1>
  <div id="status">
    MQTT: <b id="mqttStatus">—</b>
    <span id="diag"></span>
  </div>

  <div class="grid" id="bmsGrid"></div>

<script>
(() => {
  const PREFIX = "bms_radek_leszno";
  const WS_URL = "ws://broker.hivemq.com:8000/mqtt"; // jeśli działa w przeglądarce, użyj ws:// lub wss://

  const BMS_LIST = [
    {id:'1', name:'jk-bms_1'},
    {id:'2', name:'jk-bms_2'},
    {id:'3', name:'jk-bms_3'}
  ];

  const MQTT_TOPICS = {};
  const bmsElements = {};

  // generujemy wszystkie topic dla 3 BMS
  BMS_LIST.forEach(bms=>{
    MQTT_TOPICS[bms.name] = {
      voltage: `${PREFIX}/sensor/${bms.name}_voltage/state`,
      soc: `${PREFIX}/sensor/${bms.name}_soc/state`,
      capacity: `${PREFIX}/sensor/${bms.name}_battery_capacity/state`,
      balancer: `${PREFIX}/sensor/${bms.name}_balancer_current/state`,
      cell: []
    };
    for(let i=1;i<=16;i++){
      MQTT_TOPICS[bms.name].cell.push(`${PREFIX}/sensor/${bms.name}_cell_voltage_${i}/state`);
    }
  });

  // tworzymy dashboard w DOM
  const grid = document.getElementById('bmsGrid');
  BMS_LIST.forEach(bms=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="bms-header">${bms.name}</div>
      <div><span class="label">Voltage</span><span class="value" id="${bms.name}_voltage">—</span><span class="unit">V</span></div>
      <div><span class="label">SOC</span><span class="value" id="${bms.name}_soc">—</span><span class="unit">%</span></div>
      <div class="bms-soc" id="${bms.name}_soc_percent">—</div>
      <div><span class="label">Capacity Remaining</span><span class="value" id="${bms.name}_capacity">—</span><span class="unit">Ah</span></div>
      <div><span class="label">Balancer Current</span><span class="value" id="${bms.name}_balancer">—</span><span class="unit">A</span></div>
      <div class="cell-grid" id="${bms.name}_cells"></div>
    `;
    grid.appendChild(card);

    const cellGrid = card.querySelector(`#${bms.name}_cells`);
    bmsElements[bms.name] = {
      voltage: card.querySelector(`#${bms.name}_voltage`),
      soc: card.querySelector(`#${bms.name}_soc`),
      soc_percent: card.querySelector(`#${bms.name}_soc_percent`),
      capacity: card.querySelector(`#${bms.name}_capacity`),
      balancer: card.querySelector(`#${bms.name}_balancer`),
      cells: []
    };

    for(let i=0;i<16;i++){
      const cellDiv = document.createElement('div');
      cellDiv.className = 'cell';
      cellDiv.id = `${bms.name}_cell_${i+1}`;
      cellDiv.textContent = `—`;
      cellGrid.appendChild(cellDiv);
      bmsElements[bms.name].cells.push(cellDiv);
    }
  });

  const fmt = n => isNaN(n)?"—":Number(n).toFixed(2);

  const client = mqtt.connect(WS_URL,{clientId:"web_"+Math.random().toString(16).slice(2)});

  client.on('connect',()=>{
    document.getElementById('mqttStatus').textContent = "połączono";
    Object.values(MQTT_TOPICS).forEach(b=>{
      client.subscribe([b.voltage, b.soc, b.capacity, b.balancer, ...b.cell]);
    });
  });

  let msg=0, last=0;
  const diag=()=>{ document.getElementById('diag').innerHTML = ` | msg: <b>${msg}</b> | last: <b>${last?new Date(last).toLocaleTimeString():"—"}</b>`; };

  client.on('message',(t,p)=>{
    msg++; last=Date.now(); diag();
    const val = parseFloat(p.toString());

    BMS_LIST.forEach(bms=>{
      const b = MQTT_TOPICS[bms.name];
      const e = bmsElements[bms.name];
      if(t===b.voltage) e.voltage.textContent = fmt(val);
      if(t===b.soc) { e.soc.textContent = fmt(val); e.soc_percent.textContent = `${fmt(val)} %`; }
      if(t===b.capacity) e.capacity.textContent = fmt(val);
      if(t===b.balancer) e.balancer.textContent = fmt(val);
      b.cell.forEach((cTopic,i)=>{
        if(t===cTopic) e.cells[i].textContent = fmt(val)+" V";
      });
    });
  });

  client.on('offline',()=>document.getElementById('mqttStatus').textContent="offline");
  client.on('error',()=>document.getElementById('mqttStatus').textContent="błąd");

})();
</script>
</body>
</html>
