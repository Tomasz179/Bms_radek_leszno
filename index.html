<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazyn Energii – 3x JK BMS</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0d1117;
    color:#e6edf3;
    margin:0;
    padding:20px;
}
h1{
    text-align:center;
}
.status{
    text-align:center;
    margin-bottom:20px;
    font-weight:bold;
}
.section{
    border:1px solid #30363d;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
}
.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
    gap:15px;
}
.card{
    border:1px solid #30363d;
    border-radius:10px;
    padding:15px;
    background:#161b22;
}
.label{
    font-size:14px;
    color:#8b949e;
}
.value{
    font-size:22px;
    margin-top:5px;
}
.charge{ color:#2ecc71; }
.discharge{ color:#e74c3c; }
.total{
    font-size:28px;
    text-align:center;
    margin:15px 0 30px 0;
}
</style>
</head>
<body>

<h1>Magazyn Energii – 3x JK BMS</h1>
<div class="status" id="mqttStatus">MQTT: łączenie...</div>
<div class="total">Suma mocy: <span id="totalPower">0</span> W</div>

<div id="banks"></div>

<script>
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
const TOPIC_PREFIX = "bms_radek_leszno";

const banks = {
    "jk-bms_1":{},
    "jk-bms_2":{},
    "jk-bms_3":{}
};

const container = document.getElementById("banks");

function createBankUI(name){
    const section = document.createElement("div");
    section.className="section";
    section.innerHTML=`
        <h2>${name}</h2>
        <div class="grid">
            ${card("Voltage","voltage","V")}
            ${card("Current","current","A")}
            ${card("Power","power","W")}
            ${card("SOC","soc","%")}
            ${card("Capacity","battery_capacity","Ah")}
            ${card("Max Cell","max_cell","V")}
            ${card("Min Cell","min_cell","V")}
            ${card("Balancer","balancer_current","A")}
        </div>
    `;
    container.appendChild(section);
}

function card(label,id,unit){
    return `
    <div class="card">
        <div class="label">${label}</div>
        <div class="value" id="${id}">${unit==="%"?"-- %":"-- "+unit}</div>
    </div>`;
}

["jk-bms_1","jk-bms_2","jk-bms_3"].forEach(createBankUI);

function updateUI(bank,key,value){
    const el = document.getElementById(key);
    if(!el) return;

    el.textContent = value;

    if(key==="power"){
        el.classList.remove("charge","discharge");
        if(parseFloat(value)>0) el.classList.add("charge");
        if(parseFloat(value)<0) el.classList.add("discharge");
    }
}

function updateTotal(){
    let sum=0;
    Object.values(banks).forEach(b=>{
        if(b.power) sum+=parseFloat(b.power);
    });
    document.getElementById("totalPower").textContent=sum.toFixed(0);
}

// MQTT
const client = mqtt.connect(BROKER);

client.on("connect",()=>{
    document.getElementById("mqttStatus").textContent="MQTT: połączono";
    client.subscribe(`${TOPIC_PREFIX}/sensor/+/state`);
});

client.on("message",(topic,message)=>{
    const payload = message.toString();

    // dopasuj do /sensor/<sensor_name>/state
    const match = topic.match(/sensor\/(.+?)\/state$/);
    if(!match) return;

    const fullName = match[1]; // np. jk-bms_1_voltage
    const parts = fullName.split("_");
    if(parts.length<3) return;

    const bank = parts[0]+"_"+parts[1]; // jk-bms_1
    const key = parts.slice(2).join("_"); // voltage, current itp.

    banks[bank][key] = payload;
    updateUI(bank,key,payload);
    updateTotal();
});
</script>

</body>
</html>
