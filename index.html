<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magazyny Energii – Dashboard</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
:root{
  --card-w: 1200px;
  --primary: #4fc3f7;
  --secondary: #81d4fa;
  --danger: #ff5252;
}

body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background: url('https://www.transparenttextures.com/patterns/asfalt-light.png') repeat;
  opacity:0.05;
  z-index:-1;
}

h1{
  text-align:center;
  margin:20px 0 10px;
  font-size:2em;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  letter-spacing:1px;
}

#status{
  text-align:center;
  font-size:14px;
  margin-bottom:30px;
  color:#ddd;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  max-width:var(--card-w);
  margin:0 auto;
  padding-bottom:40px;
}

.card{
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  border-radius:16px;
  padding:20px 24px;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
  transition: transform 0.25s, box-shadow 0.25s;
  position:relative;
  overflow:hidden;
}

.card:hover{
  transform: translateY(-5px);
  box-shadow:0 16px 40px rgba(0,0,0,0.6);
}

.bms-title{
  font-size:1.3em;
  font-weight:bold;
  margin-bottom:12px;
  color:#fff;
  text-align:center;
  text-shadow:0 1px 2px rgba(0,0,0,0.5);
}

.label{
  display:block;
  font-weight:500;
  color:#ccc;
  font-size:0.95em;
}

.value{
  display:flex;
  justify-content: space-between;
  align-items:center;
  font-weight:700;
  font-size:1.4em;
  margin:4px 0 12px;
}

.unit{
  font-size:0.9em;
  font-weight:500;
  color:#eee;
  margin-left:6px;
}

.soc-bar{
  height:12px;
  border-radius:8px;
  background: rgba(255,255,255,0.15);
  margin-top:4px;
  overflow:hidden;
  position:relative;
}

.soc-fill{
  height:100%;
  width:0%;
  background: linear-gradient(90deg, #4caf50, #81c784);
  transition: width 0.4s ease;
}

.soc-text{
  position:absolute;
  right:6px;
  top:-2px;
  font-size:0.85em;
  color:#fff;
  font-weight:600;
}

.balancer{
  color: #ff5252;
  font-weight:700;
  font-size:1.1em;
}

.capacity{
  font-size:1em;
  color:#4fc3f7;
  margin-top:2px;
}

.cell-voltages{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(60px,1fr));
  gap:4px;
  margin-top:8px;
}

.cell{
  display:flex;
  align-items:center;
  font-size:0.85em;
  justify-content:center;
  gap:2px;
  color:#fff;
}

.cell-icon{
  font-size:0.9em;
}
</style>
</head>

<body>
<h1>Magazyny Energii – Dashboard</h1>
<div id="status">
MQTT: <b id="mqttStatus">—</b> <span id="diag"></span>
</div>

<div class="grid" id="grid"></div>

<script>
(() => {
  const PREFIX = "bms_radek_leszno";
  const WS_URL = "ws://broker.hivemq.com:8000/mqtt";

  const BMS_IDS = ['bms1','bms2','bms3'];

  // --- GENERUJ KARTY ---
  const grid = document.getElementById('grid');
  BMS_IDS.forEach(bms=>{
    const card = document.createElement('div');
    card.className='card';
    card.id=bms+'Card';
    card.innerHTML=`
      <div class="bms-title">${bms.toUpperCase()}</div>
      <span class="label">Napięcie</span><div class="value"><span id="${bms}_v">—</span><span class="unit">V</span></div>
      <span class="label">Prąd</span><div class="value"><span id="${bms}_a">—</span><span class="unit">A</span></div>
      <span class="label">Moc</span><div class="value"><span id="${bms}_w">—</span><span class="unit">W</span></div>
      <span class="label">SOC</span>
      <div class="soc-bar">
        <div class="soc-fill" id="${bms}_soc"></div>
        <span class="soc-text" id="${bms}_soc_text">—%</span>
      </div>
      <span class="label">Pozostała pojemność</span>
      <div class="value capacity"><span id="${bms}_cap">—</span><span class="unit">Ah</span></div>
      <span class="label">Balancer</span><div class="value balancer"><span id="${bms}_bal">—</span><span class="unit">A</span></div>
      <span class="label">Napięcia ogniw</span>
      <div class="cell-voltages" id="${bms}_cells">
        ${Array.from({length:16},(_,i)=>`<div class="cell"><span class="cell-icon">🔋</span> <span id="${bms}_cell_${i+1}">—</span>V</div>`).join('')}
      </div>
    `;
    grid.appendChild(card);
  });

  // --- PRZYPISANIE ELEMENTÓW ---
  const el = {};
  BMS_IDS.forEach(bms=>{
    el[bms+'_v'] = document.getElementById(bms+'_v');
    el[bms+'_a'] = document.getElementById(bms+'_a');
    el[bms+'_w'] = document.getElementById(bms+'_w');
    el[bms+'_soc'] = document.getElementById(bms+'_soc');
    el[bms+'_bal'] = document.getElementById(bms+'_bal');
    el[bms+'_cap'] = document.getElementById(bms+'_cap');
    for(let i=1;i<=16;i++){
      el[`${bms}_cell_${i}`] = document.getElementById(`${bms}_cell_${i}`);
    }
  });
  el.mqttStatus = document.getElementById('mqttStatus');
  el.diag = document.getElementById('diag');

  // --- TOPICS ---
  const TOPICS = {};
  BMS_IDS.forEach(bms=>{
    TOPICS[bms+'_v'] = `${PREFIX}/sensor/${bms}_voltage/state`;
    TOPICS[bms+'_a'] = `${PREFIX}/sensor/${bms}_current/state`;
    TOPICS[bms+'_w'] = `${PREFIX}/sensor/${bms}_power/state`;
    TOPICS[bms+'_soc'] = `${PREFIX}/sensor/${bms}_soc/state`;
    TOPICS[bms+'_bal'] = `${PREFIX}/sensor/${bms}_balancer_current/state`;
    TOPICS[bms+'_cap'] = `${PREFIX}/sensor/${bms}_battery_capacity/state`;
    for(let i=1;i<=16;i++){
      TOPICS[`${bms}_cell_${i}`] = `${PREFIX}/sensor/${bms}_cell_${i}/state`;
    }
  });

  function num(v){ const m=String(v).match(/-?\d+(?:[.,]\d+)?/); return m?parseFloat(m[0].replace(',','.')):NaN; }
  const fmt=n=>isNaN(n)?"—":n.toFixed(3).replace('.',',');

  // --- MQTT ---
  const client = mqtt.connect(WS_URL, {clientId:"web_"+Math.random().toString(16).slice(2)});
  client.on('connect',()=>{
    el.mqttStatus.textContent="połączono";
    Object.values(TOPICS).forEach(t=>client.subscribe(t));
  });

  let msg=0,last=0;
  const diag=()=> el.diag.innerHTML=` | msg: <b>${msg}</b> | last: <b>${last?new Date(last).toLocaleTimeString():"—"}</b>`;

  client.on('message',(t,p)=>{
    msg++; last=Date.now(); diag();
    const v=num(p.toString());
    Object.keys(TOPICS).forEach(k=>{
      if(t===TOPICS[k]){
        if(k.includes('soc')){
          el[k].style.width = Math.min(100, Math.max(0,v)) + '%';
          document.getElementById(k+'_text').textContent = fmt(v) + '%';
        } else {
          el[k].textContent = fmt(v);
        }
      }
    });
  });

  client.on('offline',()=>el.mqttStatus.textContent="offline");
  client.on('error',()=>el.mqttStatus.textContent="błąd");
})();
</script>

</body>
</html>
