<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazyn Energii – 3x JK BMS</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0d1117;
    color:#e6edf3;
    margin:0;
    padding:20px;
}
h1{
    text-align:center;
}
.status{
    text-align:center;
    margin-bottom:20px;
    font-weight:bold;
}
.section{
    border:1px solid #30363d;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
}
.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
    gap:15px;
}
.card{
    border:1px solid #30363d;
    border-radius:10px;
    padding:15px;
    background:#161b22;
}
.label{
    font-size:14px;
    color:#8b949e;
}
.value{
    font-size:22px;
    margin-top:5px;
}
.charge{ color:#2ecc71; }
.discharge{ color:#e74c3c; }
.total{
    font-size:28px;
    text-align:center;
    margin:15px 0 30px 0;
}
</style>
</head>
<body>

<h1>Magazyn Energii – 3x JK BMS</h1>
<div class="status" id="mqttStatus">MQTT: łączenie...</div>
<div class="total">Suma mocy: <span id="totalPower">0</span> W</div>

<div id="banks"></div>

<script>
const WS_URL = "wss://broker.hivemq.com:8884/mqtt";
const PREFIX = "bms_radek_leszno";

const banks = {
    1:{}, 2:{}, 3:{}
};

const container = document.getElementById("banks");

function createBankUI(bankNumber){
    const bankName = `jk-bms_${bankNumber}`;
    const section = document.createElement("div");
    section.className="section";
    section.innerHTML=`
        <h2>Magazyn ${bankNumber}</h2>
        <div class="grid">
            ${card(bankNumber,"voltage","V")}
            ${card(bankNumber,"current","A")}
            ${card(bankNumber,"power","W")}
            ${card(bankNumber,"soc","%")}
            ${card(bankNumber,"battery_capacity","Ah")}
            ${card(bankNumber,"max_cell","V")}
            ${card(bankNumber,"min_cell","V")}
            ${card(bankNumber,"balancer_current","A")}
        </div>
    `;
    container.appendChild(section);
}

function card(bank,key,unit){
    return `
    <div class="card">
        <div class="label">${key.replace("_"," ")}</div>
        <div class="value" id="b${bank}_${key}">${unit==="%"?"-- %":"-- "+unit}</div>
    </div>`;
}

[1,2,3].forEach(createBankUI);

function updateUI(bank,key,value){
    const el = document.getElementById(`b${bank}_${key}`);
    if(!el) return;
    el.textContent = value;

    if(key==="power"){
        el.classList.remove("charge","discharge");
        if(parseFloat(value)>0) el.classList.add("charge");
        if(parseFloat(value)<0) el.classList.add("discharge");
    }
}

function updateTotal(){
    let sum=0;
    Object.values(banks).forEach(b=>{
        if(b.power) sum+=parseFloat(b.power);
    });
    document.getElementById("totalPower").textContent=sum.toFixed(0);
}

const client = mqtt.connect(WS_URL);

client.on("connect",()=>{
    console.log("Połączono z brokerem MQTT");
    document.getElementById("mqttStatus").textContent="MQTT: połączono";
    client.subscribe(PREFIX+"/sensor/+/+/state",(err)=>{
        if(err) console.log("Błąd subskrypcji:", err);
        else console.log("Subskrybowano wszystkie sensory");
    });
});

client.on("message",(topic,message)=>{
    const payload = message.toString();
    console.log("Otrzymano:", topic, payload);

    // topic: bms_radek_leszno/sensor/jk-bms_1_voltage/state
    const match = topic.match(/jk-bms_(\d+)_(\w+)\/state$/);
    if(!match) return;

    const bank = parseInt(match[1]);
    const key = match[2];

    banks[bank][key] = payload;
    updateUI(bank,key,payload);
    updateTotal();
});

client.on("error",(err)=>{
    console.error("MQTT ERROR:", err);
    document.getElementById("mqttStatus").textContent="MQTT: błąd";
});

</script>

</body>
</html>
